[project]
name = "fec-data"
version = "0.1.0"
description = "Local FEC bulk-data downloader and dbt-duckdb project."
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.9,<2",
    "PyYAML>=6,<7",
]

[project.scripts]
# Primary console script.
download = "fec_pipeline.download:main"
# Backward-compatible alias.
fec-download = "fec_pipeline.download:main"
# Raw DuckDB loader.
load = "fec_pipeline.load:main"
# Backward-compatible alias.
fec-load = "fec_pipeline.load:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fec_pipeline"]

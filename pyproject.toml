[project]
name = "moneytrail"
version = "0.1.0"
description = "MoneyTrail local bulk-data downloader and DuckDB project."
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.9,<2",
    "fastapi>=0.115,<1",
    "PyYAML>=6,<7",
    "uvicorn>=0.35,<1",
]

[project.scripts]
# Primary console script.
download = "pipeline.download:main"
# Raw DuckDB loader (dbt zipfs path).
load = "pipeline.load:main"
# Benchmark dbt zipfs raw-load performance.
benchmark-load = "pipeline.benchmark_load:main"
# Local operations web app shell.
ops-web = "pipeline.web.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

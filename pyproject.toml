[project]
name = "fec-data"
version = "0.1.0"
description = "Local FEC bulk-data downloader and dbt-duckdb project."
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.9,<2",
]

[project.scripts]
# This gives you a friendly command via `uv run fec-download ...`.
fec-download = "fec_pipeline.download:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fec_pipeline"]
